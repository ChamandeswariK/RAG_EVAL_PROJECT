authors = [
    { name = "Chamandeswari Kaza", email = "chamandeswari.kaza@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=1.6.12",
    "langchain-ollama>=1.1.0",
